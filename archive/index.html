<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Neurodynamics Digest · Archive</title>
<style>
:root{--bg:#11161b;--panel:#171e24;--panel2:#1c252e;--line:#2a333c;--tx:#e6e9ec;--mut:#9aa7b2;--dim:#5f7180;--red:#e0453b;--link:#a9c7e0;--mono:Consolas,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.45}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.wave{font-family:var(--mono);white-space:nowrap;overflow:hidden;letter-spacing:1px;line-height:1.1;font-size:13px}
h1{font-size:32px;margin:8px 0 2px}.m{font-family:var(--mono);color:var(--mut);font-size:12px}
#q{width:100%;padding:11px 12px;margin:16px 0 10px;background:var(--panel);border:1px solid var(--line);color:var(--tx);font-size:15px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tab,.chip,.view{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:13px;padding:5px 9px;white-space:nowrap;font-family:inherit}
.tab.on{color:var(--bg);background:var(--c);border-color:var(--c)}.tab .ic{color:var(--c);font-family:var(--mono);margin-right:4px}.tab.on .ic,.tab.on .m{color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lab{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;width:100%}
.chip.on,.view.on{border-color:var(--red);color:var(--tx);background:#2a1d1f}
details{background:var(--panel);border:1px solid var(--line);padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--mut)}
select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);padding:5px;font-size:13px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
#bar{display:flex;justify-content:space-between;align-items:center;margin:12px 0}#count{font-family:var(--mono);color:var(--mut);font-size:12px}
#clear{cursor:pointer;background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:3px 8px}
#simbar{display:none;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);padding:8px 12px;margin:8px 0;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);padding:14px 16px;margin:0 0 12px}
.card h3{margin:6px 0 4px;font-size:17px}.card h3 a{color:var(--tx)}.au{color:var(--mut);font-size:13px}
.badge{font-family:var(--mono);font-size:11px;color:var(--c);border:1px solid var(--c);padding:1px 6px}.ty{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px;text-transform:uppercase}
.rel{font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.tags .chip{font-size:11px;padding:2px 6px}
.cav{color:var(--mut);font-size:13px;border-left:2px solid var(--dim);padding-left:8px}.cav b{color:var(--red);font-family:var(--mono);font-size:11px}
.note{background:#1f2a1f;border-left:2px solid #a6dc8f;padding:6px 8px;font-size:13px;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.acts button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 8px}
.acts button.on{color:var(--tx);border-color:#e8c15a}.acts a{font-size:12px;margin-left:auto}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line)}
</style></head><body><main>
<div class="wave" id="wave"></div>
<h1>The Archive</h1>
<p class="m"><a href="../">Neurodynamics Digest</a> · every newsletter item, papers sent in chat, and personal notes</p>
<input id="q" type="search" placeholder="Search titles, authors, summaries, caveats, tags, notes…" autocomplete="off">
<div class="tabs" id="tabs"></div>
<div class="row" id="views"></div>
<div class="row" id="drugs"><span class="lab">Drug</span></div>
<details id="more"><summary>More filters · method, population, date &amp; venue, PhD relevance</summary><div class="grid" id="selects"></div></details>
<div id="simbar"></div>
<div id="bar"><span id="count"></span><button id="clear">Clear all</button></div><div id="list"></div>
<p class="m">Stars and read status are saved in this browser only.</p>
</main>
<script>
// ---- Config ----
const SECTIONS=[ // [name in data, tab label, icon, accent]
["The headline act","Headline","★","#f0a35e"],["EEG","EEG","∿","#5fc9bf"],["Your own corner","Own corner","⌂","#e8c15a"],
["Psychedelic neuroimaging","Psychedelic neuroimaging","◆","#c3a6f0"],["Complexity and dynamics","Complexity","∑","#7fc0ee"],
["Weekly explainer","Explainer","Φ","#b9d86a"],["Addiction","Addiction","⟳","#f095ad"],["Brain–body coupling","Brain–body","♥\uFE0E","#f39a85"],
["Preclinical","Preclinical","⚗\uFE0E","#7ddcae"],["Critiques and nulls","Critiques","∅","#d0b090"],["Wildcards","Wildcards","✦","#e3a5e0"],
["Datasets and tools","Datasets","⚙\uFE0E","#9fb4f2"],["Policy pulse","Policy","⚖\uFE0E","#a8d8e8"],["Conferences on the horizon","Conferences","◎","#e6d27a"],
["Summer schools and training","Summer schools","✎\uFE0E","#a6dc8f"],["Funding radar","Funding","£","#e7b97a"],["Sent by Patrick","Sent by Patrick","✉\uFE0E","#e0453b"]];
const SELECTS=[ // [key, label, getter returning array of values]
["method","Method / analysis",i=>i.methods||[]],["pop","Population / condition",i=>i.populations||[]],
["date","Publication month",i=>i.pub_date?[i.pub_date.slice(0,7)]:[]],["venue","Venue",i=>i.venue?[i.venue]:[]],
["issue","Issue",i=>i.issue?["#"+i.issue]:[]],["rel","Relevance to my PhD",i=>[{3:"High",2:"Medium",1:"Low"}[i.relevance]||"Unscored"]]];
const VIEWS=[["all","All items"],["star","★ Starred"],["toread","To read"],["read","Read"]];
const TEXT=i=>[i.title,(i.authors||[]).join(" "),i.summary,i.caveats,i.notes,i.venue,(i.drugs||[]).join(" "),(i.methods||[]).join(" "),(i.populations||[]).join(" "),(i.topics||[]).join(" "),i.modality,i.item_type].join(" ").toLowerCase();
// ---- Personal state (this browser only) ----
const store={get(){try{return JSON.parse(localStorage.getItem("ndd-archive")||"{}")}catch(e){return{}}},set(s){try{localStorage.setItem("ndd-archive",JSON.stringify(s))}catch(e){}}};
let P=store.get();P.star=P.star||{};P.status=P.status||{};
const S={tab:"All",view:"all",q:"",drug:new Set(),sel:{},sim:null};
const secOf=n=>SECTIONS.find(s=>s[0]===n)||[n,n,"◆","#c3a6f0"];
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let ITEMS=[],BYID={};
$("wave").innerHTML=SECTIONS.slice(0,4).map(s=>`<div style="color:${s[3]}">${"∿".repeat(140)}</div>`).join("");
fetch("items.json").then(r=>r.json()).then(d=>{ITEMS=d.map(i=>({...i,_s:TEXT(i)}));ITEMS.forEach(i=>BYID[i.id]=i);init()})
 .catch(()=>{$("list").innerHTML='<div class="empty">Could not load the archive data.</div>'});
function init(){
 const present=new Set(ITEMS.map(i=>i.section));
 const tabs=[["All","All","◇","#e6e9ec"],...SECTIONS.filter(s=>present.has(s[0])||s[0]==="Sent by Patrick")];
 $("tabs").innerHTML=tabs.map(t=>`<button class="tab" style="--c:${t[3]}" data-t="${esc(t[0])}"><span class="ic">${t[2]}</span>${esc(t[1])} <span class="m">${t[0]==="All"?ITEMS.length:ITEMS.filter(i=>i.section===t[0]).length}</span></button>`).join("");
 $("views").innerHTML=VIEWS.map(v=>`<button class="view" data-v="${v[0]}">${v[1]}</button>`).join("");
 const drugs=[...new Set(ITEMS.flatMap(i=>i.drugs||[]))].sort((a,b)=>a.localeCompare(b));
 $("drugs").insertAdjacentHTML("beforeend",drugs.map(d=>`<button class="chip" data-d="${esc(d)}">${esc(d)}</button>`).join(""));
 $("selects").innerHTML=SELECTS.map(([k,l,g])=>{const v=[...new Set(ITEMS.flatMap(g))].sort((a,b)=>a.localeCompare(b));return `<label class="m">${l}<br><select data-k="${k}"><option value="">Any</option>${v.map(x=>`<option>${esc(x)}</option>`).join("")}</select></label>`}).join("");
 document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.t!==undefined)S.tab=d.t; else if(d.v)S.view=d.v;
  else if(d.d!==undefined){S.drug.has(d.d)?S.drug.delete(d.d):S.drug.add(d.d)}
  else if(d.f){const k=d.f.split("|")[0],v=d.f.slice(k.length+1);S.sel[k]=v;document.querySelector(`select[data-k="${k}"]`).value=v;$("more").open=true}
  else if(d.q){$("q").value=d.q;S.q=d.q.toLowerCase()}
  else if(d.star){P.star[d.star]?delete P.star[d.star]:P.star[d.star]=1;store.set(P)}
  else if(d.st){const[id,v]=d.st.split("|");P.status[id]===v?delete P.status[id]:P.status[id]=v;store.set(P)}
  else if(d.sim){S.sim=d.sim;S.tab="All";window.scrollTo(0,0)}
  else if(d.unsim!==undefined)S.sim=null;
  else if(b.id==="clear"){S.tab="All";S.view="all";S.q="";S.drug.clear();S.sel={};S.sim=null;$("q").value="";document.querySelectorAll("select").forEach(s=>s.value="")}
  else return; render()});
 $("selects").addEventListener("change",e=>{S.sel[e.target.dataset.k]=e.target.value;render()});
 $("q").addEventListener("input",e=>{S.q=e.target.value.trim().toLowerCase();render()});
 render()}
function match(i){
 if(S.tab!=="All"&&i.section!==S.tab)return false;
 if(S.view==="star"&&!P.star[i.id])return false;
 if((S.view==="toread"||S.view==="read")&&P.status[i.id]!==S.view)return false;
 if(S.drug.size&&!(i.drugs||[]).some(d=>S.drug.has(d)))return false;
 for(const[k,,g]of SELECTS){const v=S.sel[k];if(v&&!g(i).includes(v))return false}
 if(S.q&&!S.q.split(/\s+/).every(w=>i._s.includes(w)))return false;
 return true}
function card(i){const s=secOf(i.section);
 const tag=(k,v)=>`<button class="chip" data-f="${k}|${esc(v)}">${esc(v)}</button>`;
 const tags=[...(i.drugs||[]).map(d=>`<button class="chip" data-d="${esc(d)}">${esc(d)}</button>`),...(i.methods||[]).map(v=>tag("method",v)),...(i.populations||[]).map(v=>tag("pop",v)),...(i.topics||[]).map(v=>`<button class="chip" data-q="${esc(v)}">#${esc(v)}</button>`)].join("");
 const au=i.authors||[];const auT=au.length>6?au.slice(0,6).join(", ")+` +${au.length-6} more`:au.join(", ");const r=i.relevance||0;
 return `<article class="card" style="--c:${s[3]}"><span class="badge">${s[2]} ${esc(s[1])}</span><span class="ty">${esc(i.item_type||"")}${i.modality&&i.modality!=="none"?" · "+esc(i.modality):""}</span><span class="rel" title="Relevance to my PhD">PhD ${"●".repeat(r)}${"○".repeat(3-r)}</span>
 <h3>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`:esc(i.title)}</h3>
 ${auT?`<div class="au">${esc(auT)}</div>`:""}<div class="m">${esc(i.venue||"")}${i.pub_date?" · "+esc(i.pub_date):""}${i.verified===false?' · <span style="color:var(--red)">UNVERIFIED</span>':""}</div>
 <div class="tags">${tags}</div>${i.summary?`<p>${esc(i.summary)}</p>`:""}${i.caveats?`<div class="cav"><b>CAVEATS</b> ${esc(i.caveats)}</div>`:""}
 ${i.notes?`<div class="note"><b>My notes:</b> ${esc(i.notes)}</div>`:""}
 <div class="acts"><button data-star="${i.id}" class="${P.star[i.id]?"on":""}">${P.star[i.id]?"★ Starred":"☆ Star"}</button>
 <button data-st="${i.id}|toread" class="${P.status[i.id]==="toread"?"on":""}">To read</button><button data-st="${i.id}|read" class="${P.status[i.id]==="read"?"on":""}">Read</button>
 ${(i.similar||[]).length?`<button data-sim="${i.id}">More like this</button>`:""}
 ${i.issue_url?`<a href="${esc(i.issue_url)}">In issue #${esc(i.issue)} →</a>`:""}</div></article>`}
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
 document.querySelectorAll(".view").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
 document.querySelectorAll("#drugs .chip").forEach(b=>b.classList.toggle("on",S.drug.has(b.dataset.d)));
 let r;
 if(S.sim&&BYID[S.sim]){const src=BYID[S.sim];r=[src,...(src.similar||[]).map(k=>BYID[k]).filter(Boolean)];
  $("simbar").style.display="block";$("simbar").innerHTML=`Showing items similar to <b>${esc(src.title)}</b> <button data-unsim="">Back to all</button>`}
 else{$("simbar").style.display="none";r=ITEMS.filter(match).sort((a,b)=>(b.issue_date||"").localeCompare(a.issue_date||"")||(b.relevance||0)-(a.relevance||0))}
 $("count").textContent=S.sim?`${r.length-1} similar items`:`${r.length} of ${ITEMS.length} items`;
 $("list").innerHTML=r.length?r.map(card).join(""):'<div class="empty">Nothing matches. Try clearing a filter.</div>'}
</script></body></html>
